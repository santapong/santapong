<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380" role="img" aria-labelledby="title desc">
<title id="title">Santapong Sondhi — building toward embodied AGI and humanoid robots</title>
<desc id="desc">Software, AI and robotics engineer. Long-term ambition: embodied AGI and general-purpose humanoid robots. Current projects: RLM, RoboLLM, Cooker and KeepSave. The headline types through three statements; reduced motion shows the complete ambition instead.</desc>
<defs>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a7b1c2" opacity=".09"/></pattern>
<clipPath id="line-0" clipPathUnits="userSpaceOnUse"><rect class="reveal phase-0" x="76" y="207" width="0" height="46"/></clipPath>
<clipPath id="line-1" clipPathUnits="userSpaceOnUse"><rect class="reveal phase-1" x="76" y="207" width="0" height="46"/></clipPath>
<clipPath id="line-2" clipPathUnits="userSpaceOnUse"><rect class="reveal phase-2" x="76" y="207" width="0" height="46"/></clipPath>
</defs>
<style>
/* Complete, still text is the default if motion is reduced or CSS is unavailable. */
@media (prefers-reduced-motion: no-preference) {
  .motion { display: inline; }
  .still { display: none; }
  .reveal { animation: type-cycle 18s steps(48, end) infinite; }
  .phase-1 { animation-delay: 6s; }
  .phase-2 { animation-delay: 12s; }
}
@keyframes type-cycle {
  0%, 1% { width: 0; }
  14%, 26% { width: 800px; }
  32%, 100% { width: 0; }
}
</style>
<rect width="1600" height="380" rx="16" fill="#0d1117"/>
