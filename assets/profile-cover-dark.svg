<text x="76" y="65" fill="#a5adba" font-size="17" letter-spacing="3">SOFTWARE / AI / ROBOTICS</text>
<text x="72" y="149" fill="#f1f4f8" font-size="78" font-weight="700" letter-spacing="-2">Santapong Sondhi</text>
<text x="76" y="188" fill="#a5adba" font-size="21">Engineer. Builder. Exploring what intelligence can become.</text>
</g>
<g font-family="Consolas, Liberation Mono, monospace" font-size="26" fill="#c6b3f2">
<text class="still" x="76" y="239">Building toward embodied AGI and humanoid robots.</text>
<g class="motion" display="none">
<text x="76" y="239" clip-path="url(#line-0)">Building toward intelligent humanoid robots.</text>
<text x="76" y="239" clip-path="url(#line-1)">Exploring embodied AI and robot learning.</text>
<text x="76" y="239" clip-path="url(#line-2)">Making ideas real, one system at a time.</text>
</g>
</g>
