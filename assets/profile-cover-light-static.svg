<title id="title">Santapong Sondhi — building toward embodied AGI and humanoid robots</title>
<desc id="desc">Software, AI and robotics engineer. Long-term ambition: embodied AGI and general-purpose humanoid robots. Current projects: RLM, RoboLLM, Cooker and KeepSave. This is the complete still-text version of the banner.</desc>
