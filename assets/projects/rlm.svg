    <path d="M687 326L704 338L734 307" stroke-width="6"/>
    <path d="M746 310H763M746 323H763" opacity=".55"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="77" fill="#a2c4ad" font-size="21" font-weight="700" letter-spacing="2.3">PRIVATE RESEARCH</text>
    <text x="56" y="169" fill="#edf4ed" font-size="78" font-weight="700" letter-spacing="-2">RLM</text>
    <text x="60" y="227" fill="#c1d2c4" font-size="26">Reproducible robot experiments</text>
